<!doctype html>
<html lang="en">
  <head>
    <title>LibreWXR Radar</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!--
      Advanced Weather Widget: LibreWXR radar tile viewer (single-file build).
      Adapted from the official LibreWXR Leaflet example
      (https://librewxr.net/examples/leaflet) for the Advanced Weather Widget.
      Chrome-less build: this page is the map + replayer only. All radar
      controls (layer mode, color scheme, arrows, cells, alerts, theme,
      smoothing, snow mask, tile format, tile size) live in the QML side as
      native Plasma components. The base map is chosen with the in-map
      picker, which reports picks via document.title; configuration seeds
      the initial state. Initial state is seeded via URL query parameters;
      live changes arrive through the
      window.* functions (setLayerMode / setColorScheme / setArrows / setCells
      / setAlerts / setTheme / setSmooth / setSnow / setFormat / setTileSize
      / setBackground / fixViewport). The QML side keeps zoom in sync via
      document.title ("zoom:" reports). Map rotation is in-map only (no QML
      control): the leaflet-rotate plugin adds a compass control below the
      zoom control, drag-to-rotate on that control or the map (Shift+drag),
      no configuration or window.* bridge involved.

      Copyright (C) 2026 Joshua Kimsey

      Assembled into the KDE Plasma widget by its scripts/build_librewxr_map.py; edit these sources, not the built page.

      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!--
      WIDGET PATCH: map rotation (leaflet-rotate, GPL-3.0, github.com/Raruto/leaflet-rotate).
      Must load synchronously, right after leaflet.js and before any script
      that calls L.map(...), since it patches L.Map/L.GridLayer via
      L.Map.mergeOptions/addInitHook - those need to be registered on the
      class before createMap() (glue-adapter.js) instantiates it. Pinned to
      an exact version, same convention as the maplibre-gl CDN loads below.
    -->
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    <style>
/*__VIEWER_CSS__*/
/*__WIDGET_OVERRIDES_CSS__*/
    </style>
  </head>
  <body data-theme="dark">

    <!-- Map -->
    <div id="lv-map">
      <div class="preload-indicator" id="lv-preload">
        <span id="lv-preload-text">Loading frames 0/0</span>
        <div class="preload-bar"><div class="preload-fill" id="lv-preload-fill"></div></div>
      </div>
      <div class="error-overlay" id="lv-error" role="alert">
        <div class="error-msg" id="lv-error-msg"></div>
        <button type="button" class="retry-btn" id="lv-error-retry" style="display:none">Retry</button>
      </div>
      <div class="refresh-status" id="lv-refresh-status" role="status"></div>
      <button class="locate-btn" id="lv-locate" title="Return to widget location">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>
      <div class="bg-picker" id="bgPicker">
        <button class="bg-btn" id="bgBtn" title="Map background">
          <svg viewBox="0 0 24 24">
            <polygon points="12,3 21,7.5 12,12 3,7.5"></polygon>
            <polyline points="3,12 12,16.5 21,12"></polyline>
            <polyline points="3,16.5 12,21 21,16.5"></polyline>
          </svg>
        </button>
        <div class="bg-menu" id="bgMenu"></div>
      </div>
    </div>

    <!-- Replayer / Scrubber -->
    <div class="replayer">
      <div class="replayer-top">
        <button type="button" class="play-btn" id="lv-play" aria-label="Play playback">
          <svg id="lv-play-icon" viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>
          <svg id="lv-pause-icon" viewBox="0 0 16 16" style="display:none"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg>
        </button>
        <div class="scrubber-wrap">
          <div class="scrubber-track" id="lv-scrubber-track"></div>
          <div class="scrubber-ticks" id="lv-scrubber-ticks"></div>
        </div>
        <div class="timestamp-display" id="lv-timestamp">Loading...</div>
      </div>
    </div>

    <script>
