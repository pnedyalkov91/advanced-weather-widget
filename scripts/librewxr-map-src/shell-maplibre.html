<!doctype html>
<html lang="en">
  <head>
    <title>LibreWXR Radar</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!--
      Advanced Weather Widget: LibreWXR radar tile viewer, MapLibre build
      (single-file, flat map or globe). Adapted from the official LibreWXR
      MapLibre example (https://librewxr.net/examples/maplibre) for the
      Advanced Weather Widget. Same page contract as the Leaflet build
      (librewxr-map-leaflet.html, see its header): the initial state comes
      from URL query parameters, live changes through the window.* functions,
      reports go back through document.title. Without WebGL this page hands
      over to the Leaflet build with the same parameters.

    <link
      href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <!--
      Open-Meteo's file reader (vendor/, GPL-2.0-only) imports its WebAssembly
      decoder by package name; the import map points it at the vendored copy.
      Served from unpkg the .wasm arrives truncated in QtWebEngine.
    -->
    <script type="importmap">
      { "imports": { "@openmeteo/file-format-wasm": "./vendor/om_file_format.web.js" } }
    </script>
    <style>
/*__VIEWER_CSS__*/
/*__WIDGET_OVERRIDES_CSS__*/
    </style>
  </head>
  <body data-theme="dark">

    <!-- Map -->
    <div id="lv-map">
      <div class="preload-indicator" id="lv-preload">
        <span id="lv-preload-text">Loading frames 0/0</span>
        <div class="preload-bar"><div class="preload-fill" id="lv-preload-fill"></div></div>
      </div>
      <div class="error-overlay" id="lv-error" role="alert">
        <div class="error-msg" id="lv-error-msg"></div>
        <button type="button" class="retry-btn" id="lv-error-retry" style="display:none">Retry</button>
      </div>
      <div class="refresh-status" id="lv-refresh-status" role="status"></div>
      <button class="locate-btn" id="lv-locate" title="Return to widget location">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>
      <button class="locate-btn proj-btn" id="lv-proj" title="Globe">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
          <line x1="3" y1="12" x2="21" y2="12"></line>
        </svg>
      </button>
      <button class="locate-btn night-btn" id="lv-night" title="Day and night">
        <svg viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 1 0 0 18z"></path>
          <circle cx="12" cy="12" r="9"></circle>
        </svg>
      </button>
      <div class="bg-picker" id="bgPicker">
        <button class="bg-btn" id="bgBtn" title="Map background">
          <svg viewBox="0 0 24 24">
            <polygon points="12,3 21,7.5 12,12 3,7.5"></polygon>
            <polyline points="3,12 12,16.5 21,12"></polyline>
            <polyline points="3,16.5 12,21 21,16.5"></polyline>
          </svg>
        </button>
        <div class="bg-menu" id="bgMenu"></div>
      </div>
    </div>

    <!-- Replayer / Scrubber -->
    <div class="replayer">
      <div class="replayer-top">
        <button type="button" class="play-btn" id="lv-play" aria-label="Play playback">
          <svg id="lv-play-icon" viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>
          <svg id="lv-pause-icon" viewBox="0 0 16 16" style="display:none"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg>
        </button>
        <div class="scrubber-wrap">
          <div class="scrubber-track" id="lv-scrubber-track"></div>
          <div class="scrubber-ticks" id="lv-scrubber-ticks"></div>
        </div>
        <div class="timestamp-display" id="lv-timestamp">Loading...</div>
      </div>
    </div>

    <script>
/*@__WIDGET_GLUE_CONFIG__*/
/*@__WIDGET_GLUE_PREPARE__*/
// Kept loaded behind a closed popup, the map prepares in the hidden page.
var widgetPrepare = PREPARE_MODE !== 'none' ? WidgetPrepare.create(window, document) : null;
// Without WebGL MapLibre cannot draw: hand over to the Leaflet page, with
// the same parameters.
if (!hasWebGL()) location.replace('librewxr-map-leaflet.html' + location.search);
//__VIEWER_CORE__

    </script>

    <script>
/*@__WIDGET_GLUE_WIND__*/
/*@__WIDGET_GLUE_WIND_OPEN__*/
/*@__WIDGET_GLUE_WIND_TABLE__*/
/*@__WIDGET_GLUE_EARTH__*/

    </script>

    <script type="module">
// MapLibre 6 only ships as an ES module; its worker is a module too.
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs';
maplibregl.setWorkerUrl('https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl-worker.mjs');
/*@__WIDGET_GLUE_ADAPTER__*/
var _widgetAdapter = new WidgetMapLibreAdapter(maplibregl);
// Module code is not global: tests reach the map through remote debugging.
window._widgetAdapter = _widgetAdapter;
/*@__WIDGET_GLUE_CONTROLS__*/

    </script>
  </body>
</html>
